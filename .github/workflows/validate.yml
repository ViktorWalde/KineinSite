name: Validar KineinSite

# Actions fixadas por SHA de commit (comentário = a tag de origem): uma tag
# pode ser movida para outro código, um SHA não. Para atualizar, resolva a
# tag nova com `git ls-remote https://github.com/<dono>/<action> refs/tags/<tag>`.
# A execução automática será reativada quando a conta puder iniciar jobs do Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar a variante do GitHub Pages
        run: npm run build:pages
