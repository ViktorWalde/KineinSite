name: Validar KineinSite

# A execução automática será reativada quando a conta puder iniciar jobs do Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar a variante do GitHub Pages
        run: npm run build:pages
